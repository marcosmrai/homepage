<script>
// Teste: torna o título "Categories" da barra lateral um acordeão
// colapsável, em vez da nuvem de pílulas sempre visível. Só nesta
// página (referenciado via include-after-body em publications/index.qmd).
document.addEventListener("DOMContentLoaded", function () {
  var sidebar = document.getElementById("quarto-margin-sidebar");
  if (!sidebar) return;
  var title = sidebar.querySelector(".quarto-listing-category-title");
  var cloud = sidebar.querySelector(".quarto-listing-category.category-cloud");
  if (!title || !cloud) return;

  title.setAttribute("role", "button");
  title.setAttribute("tabindex", "0");
  title.setAttribute("aria-expanded", "false");
  sidebar.classList.add("categories-collapsed");

  // Ícone de hambúrguer (bi-list) do Bootstrap Icons, já carregado no
  // site inteiro — pedido explícito, no lugar da seta/chevron.
  var icon = document.createElement("i");
  icon.className = "bi bi-list";
  icon.setAttribute("aria-hidden", "true");
  title.appendChild(icon);

  function toggle() {
    var collapsed = sidebar.classList.toggle("categories-collapsed");
    title.setAttribute("aria-expanded", String(!collapsed));
  }

  title.addEventListener("click", toggle);
  title.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });

  // Move o campo de busca ("Filter") pra dentro do cartão de categorias,
  // entre o título e a lista — pedido explícito. Só em telas onde a
  // barra lateral de fato existe (o próprio Quarto a esconde por
  // completo abaixo de 768px, ver styles.css); abaixo disso o campo
  // fica onde já estava, acima da lista de publicações. O List.js (que
  // faz a busca funcionar) já terminou de se ligar ao <input> antes
  // deste ponto (seu script roda mais acima no <body>), e mover um nó
  // no DOM não desliga os listeners já presos a ele — o filtro continua
  // funcionando normalmente na nova posição.
  var filterGroup = document.querySelector(
    "#listing-listing .listing-actions-group"
  );
  if (filterGroup && window.matchMedia("(min-width: 768px)").matches) {
    sidebar.insertBefore(filterGroup, cloud);
  }
});
</script>
