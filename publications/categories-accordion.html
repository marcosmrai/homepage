<script>
// Teste: torna o título "Categories" da barra lateral um acordeão
// colapsável, em vez da nuvem de pílulas sempre visível. Só nesta
// página (referenciado via include-after-body em publications/index.qmd).
document.addEventListener("DOMContentLoaded", function () {
  var sidebar = document.getElementById("quarto-margin-sidebar");
  if (!sidebar) return;
  var title = sidebar.querySelector(".quarto-listing-category-title");
  var cloud = sidebar.querySelector(".quarto-listing-category.category-cloud");
  if (!title || !cloud) return;

  title.setAttribute("role", "button");
  title.setAttribute("tabindex", "0");
  title.setAttribute("aria-expanded", "false");
  sidebar.classList.add("categories-collapsed");

  // Ícone real do Bootstrap Icons (já carregado no site inteiro), em vez
  // de um triângulo desenhado com border+rotate em CSS — este último
  // rendeirizava como um traço solto ("\"), não como uma seta legível.
  var icon = document.createElement("i");
  icon.className = "bi bi-chevron-down";
  icon.setAttribute("aria-hidden", "true");
  title.appendChild(icon);

  function toggle() {
    var collapsed = sidebar.classList.toggle("categories-collapsed");
    title.setAttribute("aria-expanded", String(!collapsed));
  }

  title.addEventListener("click", toggle);
  title.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });
});
</script>
