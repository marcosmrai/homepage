[project]
name = "homepage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9.21",
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "flax>=0.12.2",
    "huggingface-hub>=1.28.0",
    "ipykernel>=7.3.0",
    "ipympl>=0.9.8",
    "ipywidgets>=8.1.8",
    "jax>=0.8.2",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "pandas>=2.3.3",
    "playwright>=1.62.0",
    "plotly>=6.5.0",
    "pymoo>=0.6.1.6",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
]

# Os pacotes acima (além de beautifulsoup4/playwright, do scraper de
# publicações) são o ambiente de execução dos chunks Python das aulas
# (teaching/) — o kernel Jupyter "homepage" que todo index.qmd de aula
# declara via `jupyter: homepage`. Migrado de
# ~/Documents/Research/sensible-deep-moo/code/pyproject.toml (o projeto de
# pesquisa onde esse ambiente vivia antes, sem estar capturado em nenhum
# repositório do site) — os 14 pacotes de lá, mais `datasets` e
# `huggingface-hub`, que estavam instalados manualmente no venv de lá sem
# aparecer no pyproject.toml/uv.lock daquele projeto (usados pelo padrão de
# carregar datasets do Hugging Face documentado em teaching/CLAUDE.md).
# Tudo em `dependencies` direto (não num grupo opcional `teaching`/extra) —
# pedido explícito, pra manter um único ambiente `uv sync` sem flag extra.
